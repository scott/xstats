name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt CGO_ENABLED=0 binaries for linux/amd64 and linux/arm64. Verify with: sha256sum -c SHA256SUMS" \
            dist/xstats-linux-amd64 \
            dist/xstats-linux-arm64 \
            dist/SHA256SUMS
