<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Stats</title>
<script>(function(){var q=new URLSearchParams(location.search),t=q.get('theme')||localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t})()</script>
<style>
:root{--bar:#a371f7;--bg:#07090d;--card:#0d1117cc;--bd:#1f2733;--row:#151b23;--fg:#e6edf3;--mut:#8b98a5;--acc:#1d9bf0;--up:#00d68f;--down:#ff5c7a;--grid:#1a222c;--glow1:#0d2a3f55;--glow2:#2a0d3f44;--sw:#0f141b}
[data-theme=light]{--bar:#8250df;--bg:#f5f7fa;--card:#ffffffe6;--bd:#dde3ea;--row:#eef1f5;--fg:#0f1419;--mut:#5b6773;--acc:#1d8fe0;--up:#00a36c;--down:#d6344f;--grid:#e6ebf0;--glow1:#cfe6f755;--glow2:#ead7f744;--sw:#eef1f5}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);background-image:radial-gradient(circle at 20% 0,var(--glow1),transparent 50%),radial-gradient(circle at 90% 20%,var(--glow2),transparent 40%);min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:28px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.5px;font-size:18px}.logo span{color:var(--acc)}
.right{display:flex;gap:10px;align-items:center}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;background:var(--sw);color:var(--fg);border:1px solid var(--bd);border-radius:10px;height:40px;padding:0 38px 0 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color-scheme:dark;min-width:180px}
[data-theme=light] .sel select{color-scheme:light}
.sel select:hover,.sel select:focus{border-color:var(--acc);outline:none}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select option{background:var(--sw);color:var(--fg)}
.tt{background:var(--sw);border:1px solid var(--bd);color:var(--fg);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:16px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-top:24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;min-width:0}
.lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.big{font-size:56px;font-weight:700;margin:8px 0;font-variant-numeric:tabular-nums}
.up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}.sub{color:var(--mut);font-size:13px}
.mini{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}.mini b{display:block;font-size:20px}
.side{display:flex;flex-direction:column;gap:20px}

th:first-child,td:first-child{text-align:left}td:first-child a{color:var(--fg);text-decoration:none}td:first-child a:hover{color:var(--acc)}
.d{color:var(--mut);font-size:12px;margin-top:2px}.rt{font-size:10px;border:1px solid var(--bd);color:var(--mut);border-radius:4px;padding:1px 5px;margin-right:6px}
.empty{border:1px dashed var(--bd);border-radius:10px;padding:16px;margin-top:12px;font-size:13px;color:var(--mut)}
.empty b{color:var(--fg)}
.foot{margin-top:14px;color:var(--mut);font-size:12px}
tr.pr{cursor:pointer}tr.pr:hover td{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.ov{position:fixed;inset:0;background:#0008;backdrop-filter:blur(3px);display:none;justify-content:flex-end;z-index:10}
.ov.open{display:flex}.pn{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--bd);padding:24px}
.pn .x{float:right;background:var(--sw);border:1px solid var(--bd);color:var(--fg);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:18px}
.ptext{font-size:16px;line-height:1.5;margin:12px 0;white-space:pre-wrap;word-wrap:break-word}
.plink{color:var(--acc);text-decoration:none;font-size:14px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.mg .card{padding:16px}
.mv{font-size:28px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums}
@media(max-width:820px){.pn{border-left:0;padding:16px}.mg{grid-template-columns:1fr}
.wrap{padding:16px}.grid{grid-template-columns:1fr}.big{font-size:44px}
 table thead{display:none}table,tbody,tr,td{display:block;width:100%}tr{border-bottom:1px solid var(--row);padding:10px 0}td{border:0;padding:2px 0;text-align:left}
 td.n{display:inline-block;width:auto;margin-right:14px;font-size:13px}td.n::before{content:attr(data-l)' ';color:var(--mut);font-size:11px;text-transform:uppercase}}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ch{position:relative;touch-action:manipulation}
.lg{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--mut)}
.lg i{display:inline-block;vertical-align:middle;margin-right:6px}
.lg .ln{width:16px;height:3px;border-radius:2px;background:var(--acc)}
.lg .br{width:9px;height:12px;border-radius:2px;background:var(--bar);opacity:.7}
.tip{position:absolute;z-index:5;width:262px;max-width:calc(100% - 8px);background:var(--sw);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 10px 30px #0007;font-variant-numeric:tabular-nums}
[data-theme=light] .tip{box-shadow:0 10px 30px #0f141926}
.tip .sc{display:flex;align-items:baseline;gap:8px;margin:4px 0 10px}.tip .sc b{font-size:24px;color:var(--bar)}
.tip .rw{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:5px 0;border-top:1px solid var(--row)}
.tip .rw span:nth-child(2){font-weight:600;text-align:right}.tip .rw span:nth-child(3){color:var(--mut);text-align:right;min-width:74px;white-space:nowrap}
.tip .ft{border-top:1px solid var(--bd);margin-top:4px;padding-top:8px}
.tip a{color:var(--acc);text-decoration:none;pointer-events:auto}.tip a:hover{text-decoration:underline}
</style></head><body><div class="wrap">
<header><div class="logo">X<span>/</span>stats</div>
<div class="right"><label class="sel"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Account</span><select id="sw" aria-label="Account"></select></label><button class="tt" id="tt" title="Toggle theme" aria-label="Toggle theme"></button></div></header>
<div class="grid">
 <div class="side">
  <div class="card"><div class="lbl">Followers</div><div class="big" id="fc">-</div>
   <div id="delta" class="sub"></div>
   <div class="mini"><div><span class="lbl">7d</span><b id="d7">-</b></div><div><span class="lbl">Following</span><b id="fg">-</b></div><div><span class="lbl">Posts</span><b id="pc">-</b></div></div>
   <div class="sub" style="margin-top:18px" id="snap"></div></div>
  <div class="card" id="ctc"><div class="lbl">Clickthroughs from X</div><div id="ct"></div></div>
 </div>
 <div class="card"><div class="ch-h"><div class="lbl">Follower growth</div><div class="lg"><span><i class="ln"></i>Followers</span><span><i class="br"></i>Engagement score</span></div></div><div id="chart" class="ch"></div></div>
</div>
<div class="card" style="margin-top:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="lbl">Recent posts, last 30 days</div><label class="sub" style="cursor:pointer"><input type="checkbox" id="incr"> Include replies</label></div>
<table><thead><tr><th>Post</th><th>Impressions</th><th>Likes</th><th>Replies</th><th>Reposts</th></tr></thead><tbody id="rows"></tbody></table>
<div class="foot">Metrics from public X reads, refreshed daily. Reposts include quotes. Retweets are not shown.</div></div>
</div>
<div class="ov" id="ov"><div class="pn" id="pn"></div></div>
<script>
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},dl=d=>d===today()?'Today (in progress)':d;
const $=id=>document.getElementById(id),fmt=n=>n==null?'-':n.toLocaleString('en-US');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let HANDLES=[];let D,cur=new URLSearchParams(location.search).get('acct')||localStorage.getItem('acct')||HANDLES[0];
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);$('tt').textContent=t==='dark'?'\u2600':'\u263E'}
$('tt').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(document.documentElement.dataset.theme);
function dlt(h,days){if(h.length<2)return null;const last=h[h.length-1],cut=new Date(last.date);cut.setDate(cut.getDate()-days);
 let base=h[0];for(const s of h)if(new Date(s.date)<=cut)base=s;return last.followers-base.followers}
function sign(v){return v==null?'<span class="sub">n/a</span>':`<span class="${v<0?'down':'up'}">${v>0?'+':''}${fmt(v)}</span>`}
const EROWS=[['comments','Comments'],['new_followers','New followers'],['reshares','Reshares'],['likes','Likes']];
function weights(){return (D&&D.engagement_weights)||{comments:3,new_followers:4,reshares:2,likes:1}}
function f1(n){const v=Math.round(n*10)/10;return (v===0?0:v).toFixed(1)}
function trim1(n){const s=f1(n);return s.endsWith('.0')?s.slice(0,-2):s}
function compact(n){const a=Math.abs(n),sign=n<0?'-':'';if(a>=1e6)return sign+trim1(a/1e6)+'m';if(a>=1000)return sign+trim1(a/1000)+'k';return fmt(n)}
function shortText(s){s=(s||'').replace(/\s+/g,' ').trim();return s.length>42?s.slice(0,39)+'...':s}
function tipHTML(e,date){const w=weights();
 const head=date===today()?'Today (in progress)':new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
 const scored=e.impressions>0&&typeof e.score==='number'&&Number.isFinite(e.score);
 let delta='';
 if(scored&&typeof e.score_delta==='number'&&Number.isFinite(e.score_delta)){const d=e.score_delta,cls=d>0?'up':d<0?'down':'sub';delta=`<span class="${cls}" style="margin-left:auto;font-size:12px;white-space:nowrap">${d>0?'+':''}${f1(d)} vs 7-day avg</span>`}
 const rows=EROWS.map(([k,lab])=>{const n=+e[k]||0,wt=+w[k]||0;return `<div class="rw"><span>${lab}</span><span>${fmt(n)}</span><span>\u00d7${wt} = ${fmt(wt*n)}</span></div>`}).join('');
 const pt=Math.abs(e.points)===1?'point':'points',impr=e.impressions?compact(e.impressions):'0';
 let top='';if(e.top_post&&e.top_post.url)top=`<div class="sub" style="margin-top:4px">Top post: <a href="${esc(e.top_post.url)}" target="_blank" rel="noopener">${esc(shortText(e.top_post.text))}</a></div>`;
 const note=e.impressions>0?'':'<div class="sub" style="margin-top:6px">No bar: this day has 0 impressions.</div>';
 return `<div class="lbl">${esc(head)}</div><div class="sc"><b>${scored?f1(e.score):'\u2014'}</b><span class="sub">${scored?'score':'no score'}</span>${delta}</div>${rows}<div class="ft sub"><b style="color:var(--fg)">${fmt(e.points)} ${pt}</b> / ${impr} impressions</div>${top}${note}`}
function chart(h,key,opts){key=key||'followers';opts=opts||{};const fs=opts.fs||(innerWidth<820?30:15);const W=opts.W||800,H=opts.H||220,P=opts.W?28:40,B=opts.bars||null,PR=B?(fs>20?78:46):10;if(!h.length)return '<div class="empty">No snapshots yet.</div>';
 const ys=h.map(s=>s[key]),mn=Math.min(...ys),mx=Math.max(...ys),r=Math.max(mx-mn,4),lo=mn-r*.25,hi=mx+r*.25;
 const PL=(fs>20&&!opts.W)?P*2:P,x=i=>h.length==1?W-PR:PL+(W-PL-PR)*i/(h.length-1),y=v=>16+(H-36)*(1-(v-lo)/(hi-lo));
 const pts=h.map((s,i)=>`${x(i).toFixed(1)},${y(s[key]).toFixed(1)}`);let g='';
 const xGrid=B?W-PR+10:W,st=Math.max(1,Math.ceil((hi-lo)/4));for(let v=Math.max(0,Math.ceil(lo/st)*st);v<=hi;v+=st){const yy=y(v);g+=`<line x1="${PL}" x2="${xGrid}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="0" y="${yy+4}" fill="var(--mut)" font-size="${fs}">${fmt(v)}</text>`}
 const line=h.length>1?`<path d="M${pts.join(' L')} L${x(h.length-1)},${H} L${x(0)},${H}Z" fill="url(#gr${key})"/><path d="M${pts.join(' L')}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>`:'';
 const lp=pts[pts.length-1].split(',');
 let bars='',ax2='',guide='',halo='',hits='';
 if(B){const vals=B.filter(v=>v>0);
  if(vals.length){const max=Math.max(...vals),raw=max/4,pow=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/pow,step=(n<=1?1:n<=2?2:n<=5?5:10)*pow;
   const smax=Math.ceil((max-1e-9)/step)*step||step,yb=v=>(H-20)-(H*.48)*v/smax,slot=h.length>1?(W-PL-PR)/(h.length-1):(W-PL-PR);
   const bw=Math.min(Math.max(3,(W-PL-PR)/Math.max(h.length,1)*.62),slot*.82);
   B.forEach((v,i)=>{if(!(v>0))return;const bh=Math.max(0,H-20-yb(v));bars+=`<rect class="bar" data-i="${i}" x="${(x(i)-bw/2).toFixed(1)}" y="${yb(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="var(--bar)" fill-opacity="0.38" pointer-events="none"/>`});
   const nTicks=Math.round(smax/step);for(let i=0;i<=nTicks;i++){const rv=Math.round(i*step*1e6)/1e6;ax2+=`<text x="${W-2}" y="${(yb(rv)+4).toFixed(1)}" text-anchor="end" fill="var(--bar)" font-size="${fs}" pointer-events="none">${step<1?f1(rv):fmt(Math.round(rv))}</text>`}}
  guide=`<line class="gline" y1="12" y2="${H-20}" stroke="var(--mut)" stroke-dasharray="3 3" stroke-opacity=".6" visibility="hidden" pointer-events="none"/>`;
  halo=`<circle class="ghalo" r="4.5" fill="var(--bg)" stroke="var(--acc)" stroke-width="2.5" visibility="hidden" pointer-events="none"/>`;
  B.forEach((_,i)=>{hits+=`<rect class="hit" data-i="${i}" data-x="${x(i).toFixed(1)}" data-y="${y(h[i][key]).toFixed(1)}" width="0" height="0"/>`});
  hits+=`<rect class="plot" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`}
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:10px${B?';cursor:pointer':''}" role="img" aria-label="${B?'Follower growth and daily engagement score':'Chart'}"><defs><linearGradient id="gr${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".4"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>${g}${bars}${ax2}${line}<circle cx="${lp[0]}" cy="${lp[1]}" r="5" fill="var(--acc)" pointer-events="none"/>${guide}${halo}${hits}</svg>
 <div class="sub" style="display:flex;justify-content:space-between"><span>${h[0].date}</span><span>${dl(h[h.length-1].date)}</span></div>
 ${h.length<2&&!opts.quiet?'<div class="empty">First snapshot taken '+h[0].date+'. The growth line fills in as daily snapshots run.</div>':''}`}
function hideTip(){const tip=$('tip');if(tip){tip.hidden=true;tip.dataset.pin='';tip.style.pointerEvents='none'}
 const svg=$('chart')&&$('chart').querySelector('svg');if(!svg)return;
 svg.querySelectorAll('.bar').forEach(r=>r.setAttribute('fill-opacity','0.38'));
 const gl=svg.querySelector('.gline'),gh=svg.querySelector('.ghalo');
 if(gl)gl.setAttribute('visibility','hidden');if(gh)gh.setAttribute('visibility','hidden')}
function bindTip(h){const root=$('chart'),svg=root.querySelector('svg');if(!svg)return;
 const hits=[...svg.querySelectorAll('.hit')];if(!hits.length)return;
 const tip=document.createElement('div');tip.className='tip';tip.id='tip';tip.hidden=true;tip.style.pointerEvents='none';root.appendChild(tip);
 const vb=svg.viewBox.baseVal.width||800;
 const idxFrom=e=>{const r=svg.getBoundingClientRect();if(!r.width)return -1;const x=(e.clientX-r.left)*(vb/r.width);let best=0,bd=1e9;hits.forEach((el,i)=>{const d=Math.abs(+el.dataset.x-x);if(d<bd){bd=d;best=i}});return best};
 const highlight=i=>{svg.querySelectorAll('.bar').forEach(r=>r.setAttribute('fill-opacity',r.dataset.i===String(i)?'0.95':'0.38'));
  const el=hits[i],gl=svg.querySelector('.gline'),gh=svg.querySelector('.ghalo');
  if(gl){gl.setAttribute('x1',el.dataset.x);gl.setAttribute('x2',el.dataset.x);gl.setAttribute('visibility','visible')}
  if(gh){gh.setAttribute('cx',el.dataset.x);gh.setAttribute('cy',el.dataset.y);gh.setAttribute('visibility','visible')}};
 const show=(i,pin)=>{if(i<0||!h[i]||!h[i].engagement){hideTip();return}
  tip.innerHTML=tipHTML(h[i].engagement,h[i].date);tip.hidden=false;if(pin)tip.dataset.pin='1';
  tip.style.pointerEvents=tip.dataset.pin==='1'?'auto':'none';highlight(i);
  const sr=svg.getBoundingClientRect(),rr=root.getBoundingClientRect();
  const bx=sr.left-rr.left+(+hits[i].dataset.x)*(sr.width/vb);
  let left=bx-tip.offsetWidth-12;if(left<4)left=bx+12;const max=root.clientWidth-tip.offsetWidth-4;if(left>max)left=Math.max(4,max);
  tip.style.left=left+'px';tip.style.top='16px'};
 svg.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||tip.dataset.pin==='1')return;show(idxFrom(e),false)});
 svg.addEventListener('pointerdown',e=>{show(idxFrom(e),true)});
 svg.addEventListener('pointerleave',e=>{if(tip.dataset.pin==='1')return;if(e.relatedTarget&&tip.contains(e.relatedTarget))return;hideTip()});
 tip.addEventListener('pointerleave',e=>{if(tip.dataset.pin==='1')return;if(e.relatedTarget&&svg.contains(e.relatedTarget))return;hideTip()})}
document.addEventListener('pointerdown',e=>{const ch=$('chart');if(ch&&ch.contains(e.target))return;hideTip()});
function render(){const a=D.accounts[cur];if(!a){$('fc').textContent='No data';return}
 $('sw').innerHTML=HANDLES.map(h=>`<option value="${h}"${h==cur?' selected':''}>@${h}</option>`).join('');
 $('sw').onchange=e=>{cur=e.target.value;localStorage.setItem('acct',cur);render()};
 const h=a.history,last=h[h.length-1];$('fc').textContent=fmt(last.followers);$('fg').textContent=fmt(last.following);$('pc').textContent=fmt(last.posts);
 $('delta').innerHTML=sign(dlt(h,30))+' <span class="sub">last 30 days</span>';$('d7').innerHTML=sign(dlt(h,7));$('snap').textContent='Last snapshot: '+dl(last.date);
 const hasEng=h.some(s=>s.engagement);
 $('chart').innerHTML=chart(h,'followers',{H:hasEng?380:220,bars:hasEng?h.map(s=>{const e=s.engagement;return e&&typeof e.score==='number'&&e.score>0?e.score:null}):null});
 if(hasEng)bindTip(h);
 $('ctc').style.display=(D.clickthroughs||[]).length?'':'none';const c=D.clickthroughs||[];
 $('ct').innerHTML=c.length?`<div class="big">${fmt(c.reduce((s,r)=>s+r.visits,0))}</div><div class="sub">visits from x.com and t.co, ${c[0].date} to ${c[c.length-1].date}</div>`
 :'';
 const inc=localStorage.getItem('incReplies')==='1';$('incr').checked=inc;$('incr').onchange=e=>{localStorage.setItem('incReplies',e.target.checked?'1':'0');render()};
 $('rows').innerHTML=(a.posts||[]).filter(p=>inc||!p.is_reply).map(p=>{return `<tr class="pr" data-id="${p.id}"><td><a href="#post/${p.id}">${esc(p.text.length>120?p.text.slice(0,117)+'...':p.text)}</a><div class="d">${new Date(p.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div></td>
 <td class="n" data-l="Impr">${fmt(p.impressions)}</td><td class="n" data-l="Likes">${fmt(p.likes)}</td><td class="n" data-l="Replies">${fmt(p.replies)}</td><td class="n" data-l="Reposts">${fmt(p.reposts)}</td></tr>`}).join('')||'<tr><td><div class="empty" style="text-align:center">No posts in the last 30 days</div></td></tr>'}
document.addEventListener('click',e=>{const tr=e.target.closest('tr.pr');if(tr&&!e.target.closest('a')){location.hash='post/'+tr.dataset.id}});
$('ov').onclick=e=>{if(e.target.id==='ov')closeP()};addEventListener('keydown',e=>{if(e.key==='Escape'){hideTip();closeP()}});
function closeP(){if(location.hash.startsWith('#post/'))history.pushState('',document.title,location.pathname+location.search);$('ov').classList.remove('open')}
async function openP(id){const r=await fetch('/api/post/'+id);if(!r.ok){$('pn').innerHTML='<button class="x" onclick="closeP()" aria-label="Close">\u00d7</button><div class="empty">Post not found.</div>';$('ov').classList.add('open');return}
 const p=await r.json(),h=p.history,last=h[h.length-1],prev=h.length>1?h[h.length-2]:null;

 $('pn').innerHTML=`<button class="x" onclick="closeP()" aria-label="Close">\u00d7</button><div class="lbl">@${p.account} \u00b7 ${new Date(p.created_at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</div>
 <div class="ptext">${esc(p.text)}</div><a class="plink" href="${p.url}" target="_blank" rel="noopener">View on x.com \u2197</a>
 <div class="sub" style="margin-top:6px">${h.length} daily snapshot${h.length==1?'':'s'}, ${h[0].date} to ${dl(last.date)}</div>
 <div class="mg">${M.map(([k,l])=>`<div class="card"><div class="lbl">${l}</div><div class="mv">${fmt(last[k])}</div><div class="sub">${prev?sign(last[k]-prev[k])+' since '+prev.date:'first snapshot'}</div>${chart(h,k,{W:300,H:120,fs:12,quiet:1})}</div>`).join('')}</div>
 ${h.length<2?'<div class="empty">Charts fill in as daily snapshots run.</div>':''}`;$('ov').classList.add('open')}

addEventListener('hashchange',route);
fetch('/api/data').then(r=>r.json()).then(d=>{D=d;const ks=Object.keys(D.accounts).sort();HANDLES=(D.order||[]).filter(h=>D.accounts[h]);ks.forEach(h=>{if(!HANDLES.includes(h))HANDLES.push(h)});if(!D.accounts[cur])cur=HANDLES[0];render();route()}).catch(e=>{$('fc').textContent='Error'});
