<style>

</style></head><body><div class="wrap">

 <div class="side">

<script>
const $=id=>document.getElementById(id),fmt=n=>n==null?'-':n.toLocaleString('en-US');

function rangeFromQuery(q,allowStore){let key=q.get('range')||(allowStore&&localStorage.getItem('range'))||'all';let from='',to='';
 if(key==='custom'){if(q.get('range')==='custom'){from=q.get('from')||'';to=q.get('to')||''}else if(allowStore){from=localStorage.getItem('rangeFrom')||'';to=localStorage.getItem('rangeTo')||''}}
 if(!RANGES.some(r=>r[0]===key)&&key!=='custom')key='all';
 if(key==='custom'&&(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to)||to<from))key='all';
 return {key,from,to}}
const initRange=rangeFromQuery(Q,true);
let rg=initRange.key;
let CR={from:initRange.from,to:initRange.to};

let P=null,booted=false;

const dmin=(a,b)=>a<b?a:b,dmax=(a,b)=>a>b?a:b,ndays=(f,t)=>f&&t&&t>=f?Math.round((pd(t)-pd(f))/86400000)+1:0;
const mob=()=>matchMedia('(max-width:820px)').matches;
const addM=(m,n)=>{const q=m.split('-');return isoD(new Date(Date.UTC(+q[0],+q[1]-1+n,1))).slice(0,7)};
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);$('tt').textContent=t==='dark'?'\u2600':'\u263E'}
$('tt').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(document.documentElement.dataset.theme);
function sign(v){return v==null?'<span class="sub">n/a</span>':`<span class="${v<0?'down':'up'}">${v>0?'+':''}${fmt(v)}</span>`}

function crLabel(f,t){if(!f||!t)return '';const y=f.slice(0,4)!==t.slice(0,4)||f.slice(0,4)!==today().slice(0,4),o=y?{month:'short',day:'numeric',year:'numeric'}:undefined;return f===t?fmtDay(f,o):fmtDay(f,o)+' to '+fmtDay(t,o)}
function tipHTML(e,date){
 const head=dayHead(date);
 const scored=typeof e.score==='number'&&Number.isFinite(e.score);
 let delta='';
 if(scored&&typeof e.score_delta==='number'&&Number.isFinite(e.score_delta)){const d=e.score_delta,cls=d>0?'up':d<0?'down':'sub';delta=`<span class="${cls}" style="margin-left:auto;font-size:12px;white-space:nowrap">${d>0?'+':''}${f1(d)} vs 7-day avg</span>`}
 const rows=EROWS.map(([k,lab])=>{const v=e[k];return `<div class="rw"><span>${lab}</span><span>${v==null?'-':fmt(v)}</span></div>`}).join('');
 const impr=e.impressions==null?'-':compact(e.impressions);
 let top='';if(e.top_post&&e.top_post.url)top=`<div class="sub" style="margin-top:4px">Top post: <a href="${esc(e.top_post.url)}" target="_blank" rel="noopener">${esc(shortText(e.top_post.text))}</a></div>`;
 const num=scored?fmt(Math.round(e.score)):'\u2014';

 return `<div class="lbl">${esc(head)}</div><div class="sc"><b style="color:${color}">${num}</b><span class="sub">${scored?'points':'no score'}</span>${delta}</div>${note}${rows}<div class="ft sub">${impr} impressions</div>${top}`}

function closePicker(refocus){if(!P)return;P=null;$('rp').hidden=$('rpbk').hidden=true;$('rp').innerHTML='';$('rgb').setAttribute('aria-expanded','false');if(refocus)$('rgb').focus()}
function month(m,first,last){const d0=pd(m+'-01'),off=(d0.getUTCDay()+6)%7,len=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+1,0)).getUTCDate();
 const name=d0.toLocaleDateString('en-US',{timeZone:'UTC',month:'long',year:'numeric'});
 const prevOk=addM(P.view,-1)>=P.min.slice(0,7),nextOk=addM(P.view,P.n)<=P.max.slice(0,7);
 let g='<span></span>'.repeat(off);
 for(let i=1;i<=len;i++){const ds=m+'-'+String(i).padStart(2,'0'),dis=ds<P.min||ds>P.max;
  g+=`<button type="button" role="gridcell" data-d="${ds}"${dis?' disabled':''} tabindex="-1" aria-label="${fmtDay(ds,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}${ds===P.max?', today':''}">${i}</button>`}
 return `<div class="mo"><div class="moh"><button type="button" class="nav${first?'':' ph'}" data-m="-1" aria-label="Previous month"${prevOk?'':' disabled'}>\u2039</button><span>${name}</span><button type="button" class="nav${last?'':' ph'}" data-m="1" aria-label="Next month"${nextOk?'':' disabled'}>\u203a</button></div>
 <div class="dw" aria-hidden="true">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(w=>`<span>${w}</span>`).join('')}</div><div class="dg" role="grid" aria-label="${name}">${g}</div></div>`}
function drawCal(){if(!P)return;let h='';for(let i=0;i<P.n;i++)h+=month(addM(P.view,i),i===0,i===P.n-1);$('rpm').innerHTML=h;
 $('rpm').querySelectorAll('.nav').forEach(b=>b.onclick=()=>{P.view=addM(P.view,+b.dataset.m);drawCal()});
 $('rpm').querySelectorAll('.dg button').forEach(b=>{b.onclick=()=>pickDay(b.dataset.d);b.onmouseenter=()=>{if(P.anchor&&P.hd!==b.dataset.d){P.hd=b.dataset.d;paint()}}});paint()}
function paint(){if(!P)return;const S=span();
 $('rpm').querySelectorAll('.dg button').forEach(b=>{const ds=b.dataset.d,inr=!b.disabled&&ds>=S.from&&ds<=S.to;
  b.className=[inr&&'in',inr&&ds===S.from&&'s',inr&&ds===S.to&&'e',ds===P.max&&'td'].filter(Boolean).join(' ');
  b.setAttribute('aria-selected',String(inr));b.tabIndex=ds===P.focus?0:-1});
 const sel=P.hover?null:S.k;
 $('rp').querySelectorAll('.pr').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.k===sel));b.classList.toggle('hv',b.dataset.k===P.hover)});
 const n=ndays(S.from,S.to),lbl=S.k==='custom'?'Custom':(RANGES.find(r=>r[0]===S.k)||[,S.k])[1];
 $('rps').innerHTML=`<b>${esc(lbl)}</b>: ${esc(crLabel(S.from,S.to))}, ${n} day${n===1?'':'s'}${P.anchor&&!P.hover?' (pick an end day)':''}`;
 const a=D.accounts[cur];$('rph').textContent=`Available ${fmtDay(P.min,{month:'short',day:'numeric',year:'numeric'})} to today${a.start&&a.first&&a.start>=a.first?' (account start date)':''}. Days in ${TZ()}.`;
 $('rpa').disabled=!!P.hover}
function pickDay(d){P.hover=null;P.focus=d;
 if(!P.anchor){P.anchor=d;P.hd=d;P.from=P.to=d;P.k='custom'}else{P.from=dmin(P.anchor,d);P.to=dmax(P.anchor,d);P.anchor=P.hd=null}
 paint()}
function calKey(e){const b=e.target.closest('.dg button');if(!b||!P)return;let d=pd(b.dataset.d);const wd=(d.getUTCDay()+6)%7;
 const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7,Home:-wd,End:6-wd}[e.key];
 if(mv!==undefined)d=addD(d,mv);else if(e.key==='PageUp'||e.key==='PageDown'){const q=isoD(d).split('-');d=new Date(Date.UTC(+q[0],+q[1]-1+(e.key==='PageUp'?-1:1),Math.min(+q[2],28)))}else return;
 e.preventDefault();const ds=dmax(P.min,dmin(P.max,isoD(d)));P.focus=ds;if(P.anchor)P.hd=ds;
 const m=ds.slice(0,7);if(m<P.view)P.view=m;else if(m>addM(P.view,P.n-1))P.view=addM(m,1-P.n);else{paint();const el=$('rpm').querySelector(`[data-d="${ds}"]`);if(el)el.focus();return}
 drawCal();const el=$('rpm').querySelector(`[data-d="${ds}"]`);if(el)el.focus()}
function crCheck(f,t,min,max){const ok=/^\d{4}-\d{2}-\d{2}$/;
 if(!ok.test(f||'')||!ok.test(t||''))return 'Pick a start and an end date.';
 if(t<f)return 'End must be on or after start.';
 if(f<min)return 'Start is before the first day available.';
 if(t>max)return 'End is after today.';return ''}
function applyRange(k){closePicker(true);rg=k;load()}
async function applyDraft(){if(!P||P.hover)return;if(P.anchor){P.from=P.to=P.anchor;P.anchor=null}
 if(P.k!=='custom')return applyRange(P.k);
 const err=crCheck(P.from,P.to,P.min,P.max);if(err){$('rps').innerHTML=`<span class="down">${esc(err)}</span>`;return}
 $('rpa').disabled=true;const r=await fetch('/api/data?'+new URLSearchParams({range:'custom',from:P.from,to:P.to}));
 if(!r.ok){$('rps').innerHTML=`<span class="down">${esc((await r.text()).trim())}</span>`;$('rpa').disabled=false;return}
 D=await r.json();CR={from:P.from,to:P.to};rg='custom';closePicker(true);saveRange();bootHandles();render()}
$('rgb').onclick=()=>{if(!D)return;P?closePicker(true):openPicker()};
document.addEventListener('pointerdown',e=>{if(P&&!e.target.closest('.rp')&&!e.target.closest('#rgb'))closePicker(false)});
function pageURL(){const u=new URL(location.href);u.searchParams.set('range',rg);
 if(rg==='custom'){u.searchParams.set('from',CR.from);u.searchParams.set('to',CR.to)}else{u.searchParams.delete('from');u.searchParams.delete('to')}
 if(cur)u.searchParams.set('acct',cur);return u}
function saveRange(){localStorage.setItem('range',rg);
 if(rg==='custom'){localStorage.setItem('rangeFrom',CR.from);localStorage.setItem('rangeTo',CR.to)}
 const mode=histMode;histMode='replace';
 if(mode==='skip')return;
 if(mode==='push')history.pushState({range:rg,from:CR.from,to:CR.to},'',pageURL());
 else history.replaceState({range:rg,from:CR.from,to:CR.to},'',pageURL())}
function bootHandles(){const ks=Object.keys(D.accounts||{}).sort();HANDLES=(D.order||[]).filter(h=>D.accounts[h]);ks.forEach(h=>{if(!HANDLES.includes(h))HANDLES.push(h)});if(!D.accounts[cur])cur=HANDLES[0]}
async function load(){const p=new URLSearchParams({range:rg});if(rg==='custom'){p.set('from',CR.from);p.set('to',CR.to)}
 const r=await fetch('/api/data?'+p);
 if(!r.ok){histMode='replace';if(rg!=='all'){rg='all';return load()}$('fc').textContent='Error';return}
 D=await r.json();bootHandles();saveRange();render();if(!booted){booted=true;route()}}
document.addEventListener('click',e=>{const tr=e.target.closest('tr.pr');if(tr&&!e.target.closest('a')){location.hash='post/'+tr.dataset.id}});
$('ov').onclick=e=>{if(e.target.id==='ov')closeP()};addEventListener('keydown',e=>{if(e.key==='Escape'){if(P){closePicker(true);return}hideTip();closeP()}});
function closeP(){if(location.hash.startsWith('#post/'))history.pushState('',document.title,location.pathname+location.search);$('ov').classList.remove('open')}
async function openP(id){const r=await fetch('/api/post/'+id);if(!r.ok){$('pn').innerHTML='<button class="x" onclick="closeP()" aria-label="Close">\u00d7</button><div class="empty">Post not found.</div>';$('ov').classList.add('open');return}
 const p=await r.json(),h=p.history,last=h[h.length-1],prev=h.length>1?h[h.length-2]:null;
 const M=[['impressions','Impressions'],['likes','Likes'],['replies','Replies'],['reposts','Reposts']];
 $('pn').innerHTML=`<button class="x" onclick="closeP()" aria-label="Close">\u00d7</button><div class="lbl">@${p.account} \u00b7 ${new Date(p.created_at).toLocaleString('en-US',{timeZone:TZ(),month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</div>
 <div class="ptext">${esc(p.text)}</div><a class="plink" href="${p.url}" target="_blank" rel="noopener">View on x.com \u2197</a>
 <div class="sub" style="margin-top:6px">${h.length} daily snapshot${h.length==1?'':'s'}, ${h[0].date} to ${dl(last.date)}</div>
 <div class="mg">${M.map(([k,l])=>`<div class="card"><div class="lbl">${l}</div><div class="mv">${fmt(last[k])}</div><div class="sub">${prev?(last[k]==null||prev[k]==null?'<span class="sub">-</span>':sign(last[k]-prev[k]))+' since '+prev.date:'first snapshot'}</div>${chart(h,k,{W:300,H:120,fs:12,quiet:1})}</div>`).join('')}</div>
 ${h.length<2?'<div class="empty">Charts fill in as daily snapshots run.</div>':''}`;$('ov').classList.add('open')}
function route(){const m=location.hash.match(/^#post\/(\d+)$/);if(m)openP(m[1]);else $('ov').classList.remove('open')}
addEventListener('hashchange',route);
addEventListener('popstate',()=>{if(P)closePicker(false);hideTip();const n=rangeFromQuery(new URLSearchParams(location.search),false);rg=n.key;CR={from:n.from,to:n.to};const acct=new URLSearchParams(location.search).get('acct');if(acct)cur=acct;histMode='skip';load()});
load().catch(()=>{$('fc').textContent='Error'});
</script></body></html>
